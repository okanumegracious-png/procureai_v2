name: ProcureAI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/unified-procurement-platform]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q app.py main.py procureai_store.py agentic tests
      - name: Run intake tests
        run: pytest -q
