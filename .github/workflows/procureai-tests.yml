name: ProcureAI regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx==0.27.2
      - name: Compile Python modules
        run: python -m compileall -q app.py main.py procureai_store.py agentic tests
      - name: Check browser JavaScript syntax
        run: node --check static/app.js && node --check static/auth.js && node --check static/job-completion.js
      - name: Run regression suite
        env:
          PROCUREAI_AUTO_BACKUP: "false"
        run: python -m pytest -q
